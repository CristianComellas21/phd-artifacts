[project]
name = "phd-artifacts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CristianComellas21", email = "ccf200@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.12.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
]

[project.scripts]
phd-artifact = "phd_artifacts:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
